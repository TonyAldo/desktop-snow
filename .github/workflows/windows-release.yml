name: Publish Windows release

on:
  push:
    branches: [main]
    paths: [.github/workflows/windows-release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Fetch source
        shell: pwsh
        run: |
          git init .
          git fetch --depth 1 "https://github.com/$env:GITHUB_REPOSITORY.git" $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout --detach FETCH_HEAD
      - name: Build
        shell: cmd
        run: build.cmd
      - name: Publish v1.0.2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bundle = Get-FileHash dist/DesktopSnow.exe
          Set-Content dist/DesktopSnow.exe.sha256 ($bundle.Hash.ToLowerInvariant() + '  DesktopSnow.exe') -Encoding ascii
          $notes = @'
          - Minimize a snowy window to send its drift tumbling onto lower windows or the taskbar.
          - Snow tracks the title bar more closely during fast drags and breaks into clumps when shaken.
          - Snow and animals stay behind overlapping windows. Taskbar drifts pick up soft window shadows.
          - Tray tooltips and hover previews stay clear, including taller status labels.

          Download **DesktopSnow.exe** below. Exit the previous version from the system tray before opening it.
          '@
          gh release create v1.0.2 dist/DesktopSnow.exe dist/DesktopSnow.exe.sha256 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Desktop Snow 1.0.2" --notes $notes --latest
          exit $LASTEXITCODE
