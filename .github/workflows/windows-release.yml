name: Publish Windows release

on:
  push:
    branches: [main]
    paths: [.github/workflows/windows-release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Fetch source
        shell: pwsh
        run: |
          git init .
          git fetch --depth 1 "https://github.com/$env:GITHUB_REPOSITORY.git" $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout --detach FETCH_HEAD
      - name: Build
        shell: cmd
        run: build.cmd
      - name: Publish v1.0.3
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bundle = Get-FileHash dist/DesktopSnow.exe
          Set-Content dist/DesktopSnow.exe.sha256 ($bundle.Hash.ToLowerInvariant() + '  DesktopSnow.exe') -Encoding ascii
          $notes = @'
          - Desktop Snow detects connected displays directly and refreshes when the layout changes.
          - Fullscreen auto-pause affects only the display covered by the fullscreen app.
          - Rabbits, foxes, and penguins can continue across neighboring displays, including offset and stacked layouts.
          - Snow keeps its shape and depth when you drag a window across monitors.

          Download **DesktopSnow.exe** below. Exit the previous version from the system tray before opening it.
          '@
          gh release create v1.0.3 dist/DesktopSnow.exe dist/DesktopSnow.exe.sha256 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Desktop Snow 1.0.3" --notes $notes --latest
          exit $LASTEXITCODE
