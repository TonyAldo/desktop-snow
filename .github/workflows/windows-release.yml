name: Publish Windows release

on:
  push:
    branches: [main]
    paths: [.github/workflows/windows-release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Fetch source
        shell: pwsh
        run: |
          git init .
          git fetch --depth 1 "https://github.com/$env:GITHUB_REPOSITORY.git" $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout --detach FETCH_HEAD
      - name: Build
        shell: cmd
        run: build.cmd
      - name: Publish v1.0.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bundle = Get-FileHash dist/DesktopSnow.exe
          Set-Content dist/DesktopSnow.exe.sha256 ($bundle.Hash.ToLowerInvariant() + '  DesktopSnow.exe') -Encoding ascii
          gh release create v1.0.1 dist/DesktopSnow.exe dist/DesktopSnow.exe.sha256 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Desktop Snow 1.0.1" --notes "Fixed snowbanks drawing across the Desktop Snow Settings dialog. Snow continues around the dialog while it is open. Download DesktopSnow.exe for Windows."
          exit $LASTEXITCODE
